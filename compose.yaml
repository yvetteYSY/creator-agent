services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creator_agent
      POSTGRES_USER: creator_agent
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_agent -d creator_agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - creator-agent-postgres:/var/lib/postgresql/data

  malware-scanner:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 250M
      CLAMD_CONF_MaxFileSize: 250M
      CLAMD_CONF_MaxScanSize: 300M
      CLAMD_CONF_MaxScanTime: "120000"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_MaxQueue: "4"
      CLAMD_CONF_ReadTimeout: "150"
    ports:
      - "127.0.0.1:3310:3310"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    volumes:
      - creator-agent-clamav:/var/lib/clamav

volumes:
  creator-agent-postgres:
  creator-agent-clamav:
